name: Backfill_ESP_Brand
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Fecha inicio (YYYY-MM-DD)'
        required: true
        default: '2026-11-01'
      end_date:
        description: 'Fecha fin (YYYY-MM-DD)'
        required: true
        default: '2026-11-26'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar ESP-Brand CSVs del rango
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MJ_KEY_1: ${{ secrets.MLJ1 }}
          MJ_SECRET_1: ${{ secrets.MLJ1_SECRET }}
          MJ_KEY_2: ${{ secrets.MLJ2 }}
          MJ_SECRET_2: ${{ secrets.MLJ2_SECRET }}
          MJ_KEY_3: ${{ secrets.MLJSH }}
          MJ_SECRET_3: ${{ secrets.MLJSH_SECRET }}
          SG_KEY_1: ${{ secrets.SEG }}
          SG_KEY_2: ${{ secrets.SEGSH }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const MESES_CAP = ["January","February","March","April","May","June","July","August","September","October","November","December"];
          const ESPS = ["MLJ (Mailjet) IP 1","MLJ (Mailjet) IP 2","MLJ (Mailjet) IP 3 / SH","SEG (Sendgrid) IP 1","SEG (Sendgrid) IP 2 / SH"];
          const wait = ms => new Promise(r => setTimeout(r, ms));

          const startStr = (process.env.START_DATE || "2026-11-01").trim();
          const endStr = (process.env.END_DATE || "2026-11-26").trim();

          const dateList = [];
          for (let cur = new Date(startStr + "T12:00:00Z"), end = new Date(endStr + "T12:00:00Z"); cur <= end; cur.setUTCDate(cur.getUTCDate() + 1)) {
            dateList.push(cur.toISOString().slice(0, 10));
          }
          const dailyData = {};
          for (const f of dateList) {
            dailyData[f] = {};
            for (const e of ESPS) dailyData[f][e] = {};
          }

          const codeToBrand = {};
          for (const rc of ["campaign_codes.json", "2026/Campaign codes/November/campaign_codes.json"]) {
            if (fs.existsSync(rc)) {
              const raw = JSON.parse(fs.readFileSync(rc, "utf8"));
              const mapa = raw?.brands || raw || {};
              for (const [brand, codesStr] of Object.entries(mapa)) {
                for (const c of String(codesStr || "").split(/[,;\s]+/)) {
                  const cc = c.trim().toUpperCase();
                  if (cc) codeToBrand[cc] = brand.trim();
                }
              }
              console.log("Codigos cargados desde", rc, Object.keys(codeToBrand).length);
              break;
            }
          }

          const extractCode = t => {
            const c = String(t || "").replace(/^Copy of\s+/i,"").replace(/\s*-\s*Draft$/i,"").replace(/\s*\(Copy\)$/i,"").trim();
            const m = c.match(/^(?:MLJ(?:SH|1|2)|SEGSH|SEG)(?:US|CA|NZ|UK)?\d{3,4}([A-Za-z]+?)(?:[a-z]+)?$/) || c.match(/\d{3,4}([A-Za-z]+?)(?:[a-z])?$/);
            return m ? m[1].toUpperCase() : "";
          };
          const resolveBrand = t => {
            if (!t) return "Unknown";
            const c = String(t).replace(/^Copy of\s+/i,"").replace(/\s*-\s*Draft$/i,"").replace(/\s*\(Copy\)$/i,"").trim();
            const ex = extractCode(c);
            if (ex && codeToBrand[ex]) return codeToBrand[ex];
            const mt = c.match(/\d{3,4}([A-Za-z]+)$/);
            const tail = mt ? mt[1].toUpperCase() : c.toUpperCase();
            for (const code of Object.keys(codeToBrand).sort((a,b) => b.length - a.length)) {
              if (tail === code || tail.startsWith(code)) return codeToBrand[code];
            }
            return ex || c || "Unknown";
          };
          const colDate = iso => {
            if (!iso) return "";
            const t = Date.parse(iso);
            return Number.isNaN(t) ? "" : new Date(t - 5 * 3600 * 1000).toISOString().slice(0, 10);
          };

          async function mjFetch(u, h, tries = 3) {
            for (let i = 1; i <= tries; i++) {
              try {
                const r = await fetch(u, { headers: h, signal: AbortSignal.timeout(30000) });
                if (r.ok) return JSON.parse((await r.text()).replace(/:\s*(\d{16,})(?=[,\s}\]])/g, ":\"$1\""));
                if ([429,500,502,503,504].includes(r.status) && i < tries) { await wait(i * 2000); continue; }
                throw new Error("MJ HTTP " + r.status);
              } catch (e) { if (i === tries) throw e; await wait(i * 2000); }
            }
          }
          async function mjAll(base, h) {
            const out = []; let off = 0;
            while (true) {
              const sep = base.includes("?") ? "&" : "?";
              const j = await mjFetch(`${base}${sep}Limit=1000&Offset=${off}`, h);
              const d = j.Data || []; out.push(...d);
              if (d.length < 1000) break; off += 1000;
            }
            return out;
          }

          async function runMailjet(espName, k, s) {
            if (!k || !s) return;
            const h = { Authorization: "Basic " + Buffer.from(`${k}:${s}`).toString("base64") };
            const campMap = {};
            for (let idx = 0; idx < dateList.length; idx += 4) {
              const chunk = dateList.slice(idx, idx + 4);
              const [y1,m1,d1] = chunk[0].split("-").map(Number);
              const [y2,m2,d2] = chunk[chunk.length - 1].split("-").map(Number);
              const fromTS = new Date(Date.UTC(y1, m1-1, d1, 5, 0, 0)).toISOString().slice(0,19) + "Z";
              const toTS = new Date(Date.UTC(y2, m2-1, d2+1, 5, 0, 0)).toISOString().slice(0,19) + "Z";
              const msgs = await mjAll(`https://api.mailjet.com/v3/REST/message?FromTS=${fromTS}&ToTS=${toTS}&ShowSubject=true`, h);
              const cids = [...new Set(msgs.map(x => String(x.CampaignID || "")).filter(id => id && id !== "0"))];
              for (const cid of cids) {
                if (campMap[cid]) continue;
                try {
                  const cr = await mjFetch(`https://api.mailjet.com/v3/REST/campaign/${cid}`, h);
                  const co = cr?.Data?.[0]; let title = co?.Subject || "";
                  const nl = co?.NewsLetterID || String(co?.CustomValue || "").match(/mj\.nl=(\d+)/i)?.[1];
                  if (nl) { const dr = await mjFetch(`https://api.mailjet.com/v3/REST/campaigndraft/${nl}`, h).catch(() => null); if (dr?.Data?.[0]?.Title) title = dr.Data[0].Title; }
                  campMap[cid] = resolveBrand(title);
                } catch { campMap[cid] = "Unknown"; }
              }
              let opens = null, clicks = null;
              try { opens = new Set((await mjAll(`https://api.mailjet.com/v3/REST/openinformation?FromTS=${fromTS}&ToTS=${toTS}`, h)).map(o => String(o.MessageID))); } catch {}
              try { clicks = new Set((await mjAll(`https://api.mailjet.com/v3/REST/clickstatistics?FromTS=${fromTS}&ToTS=${toTS}`, h)).map(c => String(c.MessageID))); } catch {}
              for (const msg of msgs) {
                const cid = Number(msg.CampaignID || 0);
                if (cid === 0 || /\[test\]|\btest\b/i.test(String(msg.Subject || ""))) continue;
                const f = colDate(msg.ArrivedAt);
                if (!f || !dailyData[f]) continue;
                const st = String(msg.Status || "").toLowerCase(), idStr = String(msg.ID);
                const br = campMap[String(cid)] || "Unknown";
                const blocked = st === "blocked", soft = st.includes("soft") || (st === "bounce" && !msg.StatePermanent), hard = st.includes("hard") || (st === "bounce" && Boolean(msg.StatePermanent));
                const clicked = (clicks ? clicks.has(idStr) : false) || st === "clicked";
                const opened = (opens ? opens.has(idStr) : st === "clicked") || st === "opened";
                const delivered = !(hard || soft || blocked);
                const row = dailyData[f][espName][br] || (dailyData[f][espName][br] = { Delivered:0, SoftBounce:0, HardBounce:0, Open:0, Click:0 });
                if (delivered) row.Delivered++; if (soft) row.SoftBounce++; if (hard) row.HardBounce++; if (opened) row.Open++; if (clicked) row.Click++;
              }
              console.log(espName, chunk[0], "->", chunk[chunk.length-1], "msgs:", msgs.length);
            }
          }

          async function runSendgrid(espName, k) {
            if (!k) return;
            const h = { Authorization: `Bearer ${k}` };
            const softByDay = {};
            try {
              const rIsp = await fetch(`https://api.sendgrid.com/v3/mailbox_providers/stats?start_date=${startStr}&end_date=${endStr}&aggregated_by=day`, { headers: h, signal: AbortSignal.timeout(15000) });
              if (rIsp.ok) {
                for (const d of (await rIsp.json() || [])) {
                  softByDay[d.date] = (d.stats || []).reduce((a, s) => a + (s.metrics?.blocks || 0), 0);
                }
              }
            } catch {}
            const sList = []; let nxt = "https://api.sendgrid.com/v3/marketing/singlesends?page_size=100";
            for (let p = 0; p < 6 && nxt; p++) {
              const r = await fetch(nxt, { headers: h, signal: AbortSignal.timeout(15000) });
              if (!r.ok) break;
              const j = await r.json(); sList.push(...(j.result || []));
              const nx = j._metadata?.next; nxt = nx ? (nx.startsWith("http") ? nx : `https://api.sendgrid.com${nx}`) : null;
            }
            const minMs = Date.parse(startStr + "T00:00:00Z") - 10 * 86400000, maxMs = Date.parse(endStr + "T23:59:59Z") + 2 * 86400000;
            const cands = sList.filter(ss => ss.status === "triggered" && ss.id && ss.send_at && Date.parse(ss.send_at) >= minMs && Date.parse(ss.send_at) <= maxMs);
            console.log(espName, "SingleSends candidatos:", cands.length);
            for (const ss of cands) {
              const r = await fetch(`https://api.sendgrid.com/v3/marketing/stats/singlesends/${ss.id}?aggregated_by=day&start_date=${startStr}&end_date=${endStr}`, { headers: h, signal: AbortSignal.timeout(15000) });
              if (!r.ok) continue;
              const j = await r.json(), br = resolveBrand(ss.name);
              for (const res of (j.results || [])) {
                const f = res.aggregation; if (!dailyData[f]) continue;
                const m = res.stats || {}, del = Number(m.delivered || 0), hard = Number(m.bounces || 0) + Number(m.invalid_emails || 0) + Number(m.bounce_drops || 0), op = Number(m.opens || 0), cl = Number(m.clicks || 0);
                if (del + hard + op + cl > 0) {
                  const row = dailyData[f][espName][br] || (dailyData[f][espName][br] = { Delivered:0, SoftBounce:0, HardBounce:0, Open:0, Click:0 });
                  row.Delivered += del; row.HardBounce += hard; row.Open += op; row.Click += cl;
                }
              }
            }
            for (const f of dateList) {
              const sTot = softByDay[f] || 0, entries = Object.entries(dailyData[f][espName]);
              if (sTot > 0 && entries.length) {
                if (entries.length === 1) entries[0][1].SoftBounce += sTot;
                else {
                  const totD = entries.reduce((a,[,v]) => a + v.Delivered, 0); let rem = sTot;
                  entries.forEach(([,v], idx) => {
                    if (idx === entries.length - 1) v.SoftBounce += rem;
                    else { const part = totD > 0 ? Math.round((v.Delivered / totD) * sTot) : Math.floor(sTot / entries.length); v.SoftBounce += part; rem -= part; }
                  });
                }
              }
            }
          }

          const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,"\"\"")}"` : s; };
          const rowCsv = (n, m) => [n, (m.Delivered||0)+(m.SoftBounce||0)+(m.HardBounce||0), m.Delivered||0, m.SoftBounce||0, m.HardBounce||0, m.Open||0, m.Click||0].map(cell).join(",");

          (async () => {
            await Promise.all([
              runMailjet("MLJ (Mailjet) IP 1", process.env.MJ_KEY_1, process.env.MJ_SECRET_1),
              runMailjet("MLJ (Mailjet) IP 2", process.env.MJ_KEY_2, process.env.MJ_SECRET_2),
              runMailjet("MLJ (Mailjet) IP 3 / SH", process.env.MJ_KEY_3, process.env.MJ_SECRET_3),
              runSendgrid("SEG (Sendgrid) IP 1", process.env.SG_KEY_1),
              runSendgrid("SEG (Sendgrid) IP 2 / SH", process.env.SG_KEY_2)
            ]);
            for (const f of dateList) {
              const [y, m, d] = f.split("-").map(Number), dia2 = String(d).padStart(2, "0");
              const ruta = path.join(String(y), "ESP-Brand", MESES_CAP[m - 1], `${dia2}.csv`);
              const lines = ["ESP/Brand,VOLUME,Delivered,Soft Bounce,Hard Bounce,Opened,Clicks"];
              for (const esp of ESPS) {
                const map = dailyData[f][esp] || {}, tot = { Delivered:0, SoftBounce:0, HardBounce:0, Open:0, Click:0 };
                for (const mv of Object.values(map)) for (const k of Object.keys(tot)) tot[k] += mv[k] || 0;
                lines.push(rowCsv(esp, tot));
                const sorted = Object.entries(map).sort((a,b) => ((b[1].Delivered+b[1].SoftBounce+b[1].HardBounce) - (a[1].Delivered+a[1].SoftBounce+a[1].HardBounce)) || a[0].localeCompare(b[0]));
                for (const [br, mv] of sorted) lines.push(rowCsv(br, mv));
              }
              fs.mkdirSync(path.dirname(ruta), { recursive: true });
              fs.writeFileSync(ruta, "\uFEFF" + lines.join("\r\n"), "utf8");
            }
            console.log("Backfill completado:", dateList.length, "dias guardados en ESP-Brand");
          })();
          '

      - name: Guardar CSVs en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2026/ESP-Brand
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos"
          else
            git commit -m "Backfill ESP-Brand CSVs (Nov 01 - Nov 26)"
            git push
          fi
